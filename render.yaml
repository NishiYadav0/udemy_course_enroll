services:
  - type: web
    name: udemy-course-enroll
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 render_app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: RUN_MODE
        value: poller
      - key: SELF_PING
        value: "true"
