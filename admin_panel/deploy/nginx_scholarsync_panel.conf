# Install with:
#   sudo cp nginx_scholarsync_panel.conf /etc/nginx/sites-available/scholarsync-panel
#   sudo ln -s /etc/nginx/sites-available/scholarsync-panel /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# BEFORE enabling: replace YOUR_HOME_IP below with your real public IP
# (check it at e.g. https://api.ipify.org from your own machine, not the VM).
# This is a SECOND layer of IP restriction — the primary one should be the
# Oracle Cloud Security List rule described in ADMIN_PANEL_GUIDE.md. If your
# home IP changes, update BOTH places or you will be locked out (fix that
# from the Oracle Cloud console, no SSH needed).

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/scholarsync-panel/cert.pem;
    ssl_certificate_key /etc/ssl/scholarsync-panel/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    allow YOUR_HOME_IP;
    deny all;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
