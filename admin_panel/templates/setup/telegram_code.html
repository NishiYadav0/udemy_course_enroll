{% extends "base.html" %}
{% block title %}Enter Telegram code — Admin{% endblock %}
{% block content %}

<div class="row">
  <div class="col-12 col-lg-6 mx-auto">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h5 class="fw-bold mb-1"><i class="bi bi-chat-dots"></i> Step 1 &middot; Enter the code</h5>
        <p class="text-muted mb-4">
          Telegram just sent a login code to {{ phone or 'your phone' }} &mdash; check the
          Telegram app itself (not SMS, unless Telegram falls back to it).
        </p>

        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-4">
            <label class="form-label small fw-semibold">Login code</label>
            <input type="text" class="form-control font-monospace" name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus>
          </div>
          <button type="submit" class="btn btn-primary w-100 mb-2">
            <i class="bi bi-check2"></i> Verify code
          </button>
        </form>
        <form method="post" action="{{ url_for('setup_telegram_restart') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="btn btn-link btn-sm w-100 text-muted">Didn't get it? Start over</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
